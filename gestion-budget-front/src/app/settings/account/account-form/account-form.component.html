<form [formGroup]="accountForm" (ngSubmit)="onSubmit()" class="inline-settings-form" id="editForm"
    [class]="this.accountService.editingAccount()?.id ? 'editForm':''">

    <div class="form-group font-field">
        <label for="accountLabel">Nom du compte</label>
        <input id="accountLabel" type="text" formControlName="label" placeholder="Ex: Compte Courant, Livret A...">
        @if (accountForm.get('label')?.touched && accountForm.get('label')?.invalid) {
        <small class="error-text">Obligatoire (3 car. min)</small>
        }
    </div>

    <div class="form-group balance-field">
        <label for="balance">Solde Initial (€)</label>
        <input id="balance" type="number" formControlName="initialBalance" placeholder="0.00">

    </div>

    <div class="checkbox-field">
        <label class="checkbox-label">
            <input type="checkbox" formControlName="isDefault">
            <span>Par défaut</span>
        </label>
    </div>

    <div class="form-actions-inline">
        @if (this.accountService.editingAccount() !== null) {
        <button type="button" class="btn-cancel" (click)="onCancelEdit()">Annuler</button>
        }
        <button type="submit" class="btn-add-submit" [disabled]="accountForm.invalid">
            {{ this.accountService.editingAccount() !== null ? 'Enregistrer' : 'Ajouter' }}
        </button>
    </div>
</form>

@if (errorMessage()) {
<div class="alert-error">{{ errorMessage() }}</div>
}
