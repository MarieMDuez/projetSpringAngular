<form [formGroup]="projectedBudgetSettingsForm" (ngSubmit)="onSubmit()" class="form-inline" id="editForm"
    [class.edit-mode]="projectedBudgetSettingsService.editingProjectedBudgetSettings()?.id">

    <div class="form-group">
        <label for="projectedBudgetSettingsCategory">Catégorie</label>
        <select id="projectedBudgetSettingsCategory" formControlName="categoryId" appSelectLoop>
            <option value="">— Choisir —</option>
            @for (categorie of categories(); track categorie.id) {
            <option [value]="categorie.id">{{ categorie.label }}</option>
            }
        </select>
    </div>

    <div class="form-group">
        <label for="projectedBudgetSettingsType">Type de mouvement</label>
        <select id="projectedBudgetSettingsType" formControlName="type" appSelectLoop>
            <option value="">— Choisir —</option>
            @for (type of projectedBudgetCategoryType; track type) {
            <option [value]="type">
                {{ projectedBudgetCategoryTypeLabels[type] }}
            </option>
            }
        </select>
    </div>




    <div class="form-actions">
        @if (projectedBudgetSettingsService.editingProjectedBudgetSettings() !== null) {
        <button type="button" class="btn-secondary-link" (click)="onCancelEdit()">Annuler</button>
        }

        <button type="submit" class="btn-primary" [disabled]="projectedBudgetSettingsForm.invalid">
            {{ projectedBudgetSettingsService.editingProjectedBudgetSettings() !== null ? 'Enregistrer' : 'Ajouter' }}
        </button>
    </div>
</form>
