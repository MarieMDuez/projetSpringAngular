<div class="settings-container">
  <header class="settings-header">
    <h1>Configurations</h1>
    <p class="text-muted">Gérez vos structures de comptes, catégories de dépenses et moyens de paiement.</p>
  </header>

  <div class="settings-grid">

    <section class="saas-card">
      <div class="card-header">
        <h3>Comptes Bancaires</h3>
      </div>
      <app-account-list></app-account-list>
    </section>
    <section class="saas-card">
      <div class="card-header">
        <h3>Moyens de Paiement</h3>
      </div>
      <app-payment-method-list></app-payment-method-list>
    </section>

    <section class="saas-card">
      <div class="card-header">
        <h3>Catégories</h3>
      </div>
      <app-category-list></app-category-list>
    </section>



  </div>
</div>
