<form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="inline-settings-form" id="editForm"
    [class]="this.categoryService.editingCategory()?.id ? 'editForm':''">

    <div class="form-group font-field">
        <label for="categoryLabel">Nom de la catégorie</label>
        <input id="categoryLabel" type="text" formControlName="label" placeholder="Ex: Loyer, Électricité, Courses...">
        @if (categoryForm.get('label')?.touched && categoryForm.get('label')?.invalid) {
        <small class="error-text">Obligatoire (3 car. min)</small>
        }
    </div>

    <div class="form-actions-inline">
        @if (this.categoryService.editingCategory() !== null) {
        <button type="button" class="btn-cancel" (click)="onCancelEdit()">Annuler</button>
        }
        <button type="submit" class="btn-add-submit" [disabled]="categoryForm.invalid">
            {{ this.categoryService.editingCategory() !== null ? 'Enregistrer' : 'Ajouter' }}
        </button>
    </div>
</form>

@if (errorMessage()) {
<div class="alert-error">{{ errorMessage() }}</div>
}
