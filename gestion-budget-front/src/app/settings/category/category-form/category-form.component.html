<form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="form-inline" id="editForm"
    [class.edit-mode]="this.categoryService.editingCategory()?.id">

    <!-- Champ : Nom de la catégorie -->
    <div class="form-group">
        <label for="categoryLabel">Nom de la catégorie</label>
        <input id="categoryLabel" type="text" formControlName="label" placeholder="Ex: Loyer, Électricité, Courses...">
        @if (categoryForm.get('label')?.touched && categoryForm.get('label')?.invalid) {
        <small class="error-text">Obligatoire (3 car. min)</small>
        }
    </div>

    <!-- Actions du Formulaire -->
    <div class="form-actions">
        @if (this.categoryService.editingCategory() !== null) {
        <button type="button" class="btn-secondary-link" (click)="onCancelEdit()">Annuler</button>
        }
        <button type="submit" class="btn-primary" [disabled]="categoryForm.invalid">
            {{ this.categoryService.editingCategory() !== null ? 'Enregistrer' : 'Ajouter' }}
        </button>
    </div>
</form>
