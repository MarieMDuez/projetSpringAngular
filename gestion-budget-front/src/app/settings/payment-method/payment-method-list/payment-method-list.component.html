<div class="payment-method-list-container">
  <!-- Formulaire d'ajout/modification imbriqué -->
  <app-payment-method-form></app-payment-method-form>

  <div class="data-list" cdkDropList (cdkDropListDropped)="onDrop($event)">
    @for (paymentMethod of paymentMethods(); track paymentMethod.id) {
    <div class="data-item" [class.item-disabled]="!paymentMethod.isActive" cdkDrag>

      <!-- Poignée de glissement (Drag Handle) -->
      @if (paymentMethod.isActive) {
      <span class="drag-handle" cdkDragHandle>☰</span>
      } @else {
      <span class="drag-handle-placeholder"></span>
      }

      <!-- Informations du Moyen de Paiement -->
      <div class="item-info">
        <span class="item-name">
          {{ paymentMethod.label }}
          @if (!paymentMethod.isActive) {
          <span class="badge-archived">(Archivé)</span>
          }
        </span>
      </div>

      <!-- Actions sur le Moyen de Paiement -->
      <div class="item-actions">
        @if (paymentMethod.isActive) {
        <button type="button" class="btn-icon" (click)="onEdit(paymentMethod)" title="Modifier">✏️</button>
        <button type="button" class="btn-icon" (click)="onDelete(paymentMethod)" title="Supprimer">🗑️</button>
        }
      </div>

    </div>
    } @empty {
    <p class="text-muted text-small">Aucun moyen de paiement disponible pour le moment.</p>
    }
  </div>
</div>
