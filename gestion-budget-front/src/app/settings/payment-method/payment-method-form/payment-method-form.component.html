<form [formGroup]="paymentMethodForm" (ngSubmit)="onSubmit()" class="form-inline" id="editForm"
    (keydown.enter)="$event.preventDefault(); paymentMethodForm.valid && onSubmit()"
    [class.edit-mode]="paymentMethodService.editingPaymentMethod()?.id">

    <div class="form-group">
        <label for="paymentMethodLabel">Nom du moyen de paiement</label>
        <input id="paymentMethodLabel" type="text" formControlName="label"
            placeholder="Ex: Virement, Carte Bancaire, Espèces..." autofocus>
        @if (paymentMethodForm.get('label')?.dirty && paymentMethodForm.get('label')?.invalid) {
        <small class="error-text">Obligatoire (3 car. min)</small>
        }
    </div>

    <div class="form-actions">
        @if (paymentMethodService.editingPaymentMethod() !== null) {
        <button type="button" class="btn-secondary-link" (click)="onCancelEdit()">Annuler</button>
        }
        <button type="submit" class="btn-primary" [disabled]="paymentMethodForm.invalid">
            {{ paymentMethodService.editingPaymentMethod() !== null ? 'Enregistrer' : 'Ajouter' }}
        </button>
    </div>
</form>
