<div class="quick-add-container" [class]="this.transactionService.transactionToEdit()?.id ? 'editForm':''"
    id="editForm">
    <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
        <table class="transaction-table">
            <caption>Ajouter une transaction</caption>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Compte</th>
                    <th>Moyen de Paiement</th>
                    <th>Catégorie</th>
                    <th>Description</th>
                    <th>Type</th>
                    <th>Montant</th>
                    <th>Réc. (Mois)</th>
                    <th class="text-center">Pointée</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr class="inline-form-row">

                    <td>
                        <input type="date" formControlName="emissionDate" class="inline-input"
                            [class.input-error]="transactionForm.get('emissionDate')?.touched && transactionForm.get('emissionDate')?.invalid">
                    </td>


                    <td>
                        <select formControlName="accountId" class="inline-select" appSelectLoop>
                            <option value="">— Choisir —</option>
                            @for (account of accounts(); track account.id) {
                            <option [value]="account.id">{{ account.label }} {{!account.isActive ? ' (Désactivé)':''}}
                            </option>
                            }
                        </select>
                    </td>


                    <td>
                        <select formControlName="paymentMethodId" class="inline-select" appSelectLoop>
                            <option value="">— Choisir —</option>
                            @for (paymentMethod of paymentMethods(); track paymentMethod.id) {
                            <option [value]="paymentMethod.id">{{ paymentMethod.label }}</option>
                            }
                        </select>
                    </td>


                    <td>
                        <select formControlName="categoryId" class="inline-select" appSelectLoop>
                            <option value="">— Choisir —</option>
                            @for (categorie of categories(); track categorie.id) {
                            <option [value]="categorie.id">{{ categorie.label }}</option>
                            }
                        </select>
                    </td>


                    <td>
                        <input type="text" formControlName="description" placeholder="Facultatif" class="inline-input"
                            appSelectLoop>
                    </td>


                    <td>
                        <select formControlName="type" class="inline-select select-type">
                            <option value="DEBIT">Débit (-)</option>
                            <option value="CREDIT">Crédit (+)</option>
                        </select>
                    </td>


                    <td>
                        <input type="number" step="0.01" formControlName="amount" placeholder="0.00"
                            class="inline-input text-right">
                    </td>


                    <td>
                        <input type="number" formControlName="recurrenceMonths" placeholder="0 (Unique)"
                            class="inline-input input-recurrence" min="0">
                    </td>


                    <td class="text-center">
                        <input id="isChecked" type="checkbox" formControlName="isChecked" class="checkbox-pointer"
                            title="Marquer comme pointée d'avance">
                    </td>



                    <td class="text-center">
                        <button type="submit" [disabled]="transactionForm.invalid" class="btn-add-submit">
                            {{transactionService.transactionToEdit()?.id ? 'Modifier' : 'Ajouter'}}
                        </button>
                    </td>

                </tr>
            </tbody>
        </table>
    </form>



    @if (errorMessage()) {
    <div class="alert-error">{{ errorMessage() }}</div>
    }
</div>
