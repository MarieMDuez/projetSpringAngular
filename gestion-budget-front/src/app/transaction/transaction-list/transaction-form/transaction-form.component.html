<div class="quick-add-container" [class.edit-mode]="this.transactionService.transactionToEdit()?.id" id="editForm">

    <h3 class="section-title-tracker">
        {{ transactionService.transactionToEdit()?.id ? 'Modifier la transaction' : 'Ajouter une transaction' }}
    </h3>

    <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()" class="form-grid-inline">

        <!-- Champ : Date -->
        <div class="form-group-tracker">
            <label for="emissionDate">Date</label>
            <input id="emissionDate" type="date" formControlName="emissionDate"
                [class.input-error]="transactionForm.get('emissionDate')?.touched && transactionForm.get('emissionDate')?.invalid">
        </div>

        <!-- Champ : Compte -->
        <div class="form-group-tracker">
            <label for="accountId">Compte</label>
            <select id="accountId" formControlName="accountId" appSelectLoop>
                <option value="">— Choisir —</option>
                @for (account of accounts(); track account.id) {
                <option [value]="account.id">{{ account.label }} {{ !account.isActive ? ' (Désactivé)' : '' }}</option>
                }
            </select>
        </div>

        <!-- Champ : Moyen de Paiement -->
        <div class="form-group-tracker">
            <label for="paymentMethodId">Moyen de Paiement</label>
            <select id="paymentMethodId" formControlName="paymentMethodId" appSelectLoop>
                <option value="">— Choisir —</option>
                @for (paymentMethod of paymentMethods(); track paymentMethod.id) {
                <option [value]="paymentMethod.id">{{ paymentMethod.label }}</option>
                }
            </select>
        </div>

        <!-- Champ : Catégorie -->
        <div class="form-group-tracker">
            <label for="categoryId">Catégorie</label>
            <select id="categoryId" formControlName="categoryId" appSelectLoop>
                <option value="">— Choisir —</option>
                @for (categorie of categories(); track categorie.id) {
                <option [value]="categorie.id">{{ categorie.label }}</option>
                }
            </select>
        </div>

        <!-- Champ : Description (Plus large) -->
        <div class="form-group-tracker wide-field">
            <label for="description">Description</label>
            <input id="description" type="text" formControlName="description" placeholder="Facultatif" appSelectLoop>
        </div>

        <!-- Champ : Type (Débit / Crédit) -->
        <div class="form-group-tracker">
            <label for="transactionType">Type</label>
            <select id="transactionType" formControlName="type">
                <option value="DEBIT">Débit (-)</option>
                <option value="CREDIT">Crédit (+)</option>
            </select>
        </div>

        <!-- Champ : Montant -->
        <div class="form-group-tracker">
            <label for="amount">Montant</label>
            <input id="amount" type="number" step="0.01" formControlName="amount" placeholder="0.00"
                style="text-align: right;">
        </div>

        <!-- Champ : Récurrence (Plus étroit) -->
        <div class="form-group-tracker narrow-field">
            <label for="recurrenceMonths">Réc. (Mois)</label>
            <input id="recurrenceMonths" type="number" formControlName="recurrenceMonths" placeholder="0" min="0">
        </div>

        <!-- Champ : Pointée (Checkbox alignée) -->
        <div class="form-group-tracker checkbox-field">
            <label style="display: flex; align-items: center; gap: 0.375rem; cursor: pointer;">
                <input type="checkbox" formControlName="isChecked" class="checkbox-pointer"
                    title="Marquer comme pointée d'avance">
                <span
                    style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted);">Pointée</span>
            </label>
        </div>

        <!-- Actions : Boutons Soumission / Annulation -->
        <div style="display: flex; gap: 0.5rem; align-items: center; height: 36px;">
            @if (transactionService.transactionToEdit()?.id) {
            <button type="button" class="btn-secondary-link" (click)="onCancelEdit()">Annuler</button>
            }
            <button type="submit" [disabled]="transactionForm.invalid" class="btn-primary">
                {{ transactionService.transactionToEdit()?.id ? 'Enregistrer' : 'Ajouter' }}
            </button>
        </div>



    </form>

    <!-- ZONE DES OPTIONS SECONDAIRES (Placée proprement en bas de la boîte) -->
    <div class="filters-footer-tools">
        <!-- Outil : Générer les récurrentes -->
        <div class="tool-generate-block">
            <span class="tool-label">Générer les transactions récurrentes pour :</span>
            <div class="tool-inputs">
                <select appSelectLoop id="gen-month" #genMonth>
                    @for (m of availableMonths; track m.value) {
                    <option [value]="m.value" [selected]="m.label === defaultMonth">
                        {{ m.label | titlecase }}
                    </option>
                    }
                </select>
                <input type="number" id="gen-year" placeholder="Année" #genYear [value]="defaultYear"
                    style="width: 80px;" />
                <button type="button" class="btn-primary" style="height: 34px; padding: 0 1rem;"
                    [disabled]="!genYear.value || !genMonth.value"
                    (click)="generateRecurrent(Number(genMonth.value), Number(genYear.value))">
                    Générer
                </button>
            </div>
        </div>


    </div>

    <!-- Message d'erreur -->
    @if (errorMessage()) {
    <div class="alert-error">{{ errorMessage() }}</div>
    }

</div>
