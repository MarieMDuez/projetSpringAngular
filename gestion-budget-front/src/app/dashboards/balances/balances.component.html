<div class="balances-container">
    <div class="balances-scope">
        <label for="scopeAccountSelect" class="scope-label">Périmètre des calculs :</label>
        <div class="select-wrapper">
            <select id="scopeAccountSelect" [ngModel]="transactionService.selectedAccountIdFilter()"
                (ngModelChange)="onAccountScopeChange($event)" class="scope-select">
                <option [ngValue]="null">🌍 Tous les comptes bancaires <strong>actifs</strong></option>
                @for (acc of accountService.allAccounts(); track acc.id) {
                <option [ngValue]="acc.id">{{ acc.label }} {{ !acc.isActive ? '(Archivé)' : '' }}</option>
                }
            </select>
        </div>
    </div>

    @if (currentBalances(); as balances) {
    <div class="balances-summary">
        <div class="balance-card card-real">
            <span class="balance-title">Solde Réel (Pointé)</span>
            <span class="balance-amount">{{ balances.currentBalance | number:'1.2-2' }} €</span>
        </div>
        <div class="balance-card card-projected">
            <span class="balance-title">Solde Prévisionnel</span>
            <span class="balance-amount">{{ balances.projectedBalance | number:'1.2-2' }} €</span>
        </div>
    </div>
    }
</div>
