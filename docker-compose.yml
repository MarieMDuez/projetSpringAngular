version: "3.8"

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: budget-postgres-db
    environment:
      POSTGRES_DB: gestionCompte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend-app:
    build: .
    container_name: budget-backend-app
    ports:
      - "9000:9000"
    depends_on:
      - postgres-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/gestionCompte
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

volumes:
  pgdata:
